stages:
  - test
  - research

test:
  stage: test
  image: python:${PYTHON}-slim
  parallel:
    matrix:
      - PYTHON: ["3.9", "3.10", "3.11", "3.12", "3.13"]
  script:
    - pip install --quiet pytest .
    - pytest -q
    # The fixtures must keep producing findings in every output format.
    - dotless scan tests/fixtures --format sarif --output fixtures.sarif --exit-zero
    - dotless scan tests/fixtures --format gitlab --output fixtures-codequality.json --exit-zero
    - dotless scan tests/fixtures --min-severity high && exit 1 || test $? -eq 1

# Dogfood the template on this repository (fixtures are bad on purpose).
include:
  - local: ci/dotless.gitlab-ci.yml

dotless:
  variables:
    DOTLESS_PATHS: "."
    DOTLESS_ARGS: "--exclude tests/fixtures --exclude research --exclude reproducers"
  before_script:
    - pip install --quiet --disable-pip-version-check .

# Runs the locale probes in research/ against glibc with Turkish and
# Azerbaijani locales generated. The table it prints is the source of
# docs/research.md.
research:glibc:
  stage: research
  needs: []
  image: debian:trixie
  rules:
    - changes: [research/**/*]
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    DEBIAN_FRONTEND: noninteractive
    RUST_FEATURES: glib
  script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends
        locales build-essential pkg-config libglib2.0-dev valac
        python3 python3-gi gir1.2-glib-2.0 gjs nodejs cargo rustc ca-certificates
        > /dev/null
    - for l in en_US tr_TR az_AZ; do localedef -i $l -f UTF-8 $l.UTF-8; done
    - localedef -i tr_TR -f ISO-8859-9 tr_TR.ISO-8859-9
    - locale -a
    - gjs --version; node --version; valac --version; python3 --version; rustc --version; ldd --version | head -1
    - sh research/run.sh
    # Which high-level glib-rs wrappers end up in g_utf8_strdown/strup?
    - grep -rn -B3 "ffi::g_utf8_str\(down\|up\)\|ffi::g_utf8_casefold" ~/.cargo/registry/src/*/glib-0.*/src || true
  artifacts:
    paths: [research/out/results.tsv, research/out/results.md]

# musl does not implement locale-specific case mapping; this job shows how
# the same C calls behave there (Alpine).
research:musl:
  stage: research
  needs: []
  image: alpine:3.20
  rules:
    - changes: [research/**/*]
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    LOCALES: "C.UTF-8 tr_TR.UTF-8 az_AZ.UTF-8"
  script:
    - apk add -q gcc musl-dev python3 musl-locales
    - sh research/run.sh
  artifacts:
    paths: [research/out/results.md]

# Runs the reproducers for the findings in reports/ on Debian with Turkish
# and Azerbaijani locales.
reproducers:
  stage: research
  needs: []
  image: debian:trixie
  rules:
    - changes: [reproducers/**/*]
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    DEBIAN_FRONTEND: noninteractive
  script:
    - apt-get update -qq
    - apt-get install -qq -y --no-install-recommends
        locales build-essential pkg-config libglib2.0-dev
        curl ca-certificates > /dev/null
    - for l in tr_TR az_AZ; do localedef -i $l -f UTF-8 $l.UTF-8; done
    - sh reproducers/run.sh
